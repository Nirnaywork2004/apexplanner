<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <circle cx="200" cy="140" r="100" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <!-- Screen Base -->
  <rect x="90" y="60" width="220" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="98" y="68" width="204" height="119" rx="4" fill="url(#screen)"/>
  <!-- Code/UI on screen -->
  <rect x="110" y="80" width="50" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="110" y="92" width="80" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="110" y="100" width="65" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="110" y="108" width="95" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="110" y="125" width="40" height="15" rx="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="240" cy="120" r="30" fill="#ffffff" opacity="0.15"/>
  <polygon points="230,105 255,120 230,135" fill="#ffffff" opacity="0.8"/>
  <!-- Laptop Keyboard Base -->
  <path d="M 60,200 L 340,200 L 360,225 L 40,225 Z" fill="url(#body)"/>
  <rect x="160" y="204" width="80" height="5" rx="2.5" fill="#334155"/>
  <rect x="175" y="214" width="50" height="7" rx="2" fill="#334155"/>
</svg>
