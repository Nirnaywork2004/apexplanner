<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
      <linearGradient id="bg_lmp" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      <radialGradient id="lamp_light" cx="50%" cy="40%" r="50%">
        <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="400" height="300" rx="16" fill="url(#bg_lmp)"/>
    <!-- Light cone -->
    <polygon points="200,90 100,240 300,240" fill="url(#lamp_light)"/>
    <!-- Base -->
    <ellipse cx="200" cy="240" rx="45" ry="12" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <!-- Stem -->
    <path d="M 200,235 L 200,140 L 220,95" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="200" cy="140" r="5" fill="#e2e8f0"/>
    <!-- Shade -->
    <path d="M 175,95 L 265,95 L 245,65 L 195,65 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Light bulb glow dot -->
    <circle cx="220" cy="95" r="8" fill="#fde047"/>
  </svg>